services:

  postgres:
    image: postgres:16-alpine
    container_name: scamshield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: scamshield
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d scamshield"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - scamshield-network


  ai-intelligence:
    build:
      context: ./ai-intelligence
      dockerfile: Dockerfile

    container_name: scamshield-ai
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 6100
      AI_PROVIDER: ${AI_PROVIDER}
      NARA_API_KEY: ${NARA_API_KEY}
      NARA_MODEL: ${NARA_MODEL}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS}

    expose:
      - "6100"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6100/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - scamshield-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: scamshield-backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URL: ${FRONTEND_URL}
      AI_SERVICE_URL: http://ai-intelligence:6100

    expose:
      - "5000"

    depends_on:
      postgres:
        condition: service_healthy
      ai-intelligence:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - scamshield-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: scamshield-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - scamshield-network


volumes:
  postgres_data:


networks:
  scamshield-network:
    driver: bridge
