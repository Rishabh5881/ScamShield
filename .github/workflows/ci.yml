name: ScamShield CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test, Build and Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scamshield
          POSTGRES_PASSWORD: scamshield_test
          POSTGRES_DB: scamshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scamshield -d scamshield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://scamshield:scamshield_test@localhost:5432/scamshield_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
      AI_SERVICE_URL: http://localhost:6100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            ai-intelligence/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install AI service dependencies
        working-directory: ai-intelligence
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run AI service tests
        working-directory: ai-intelligence
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Security audit - frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Security audit - backend
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Security audit - AI service
        working-directory: ai-intelligence
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t scamshield-backend ./backend

      - name: Build AI service Docker image
        run: docker build -t scamshield-ai ./ai-intelligence

      - name: Build frontend Docker image
        run: docker build -t scamshield-frontend ./frontend